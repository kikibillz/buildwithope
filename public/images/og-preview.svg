<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Accent Border Frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d97706" stroke-width="2" opacity="0.4" rx="12" />

  <!-- Badge -->
  <g transform="translate(80, 85)">
    <rect width="320" height="38" rx="6" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#10b981" />
    <text x="36" y="24" font-family="monospace" font-size="13" font-weight="bold" fill="#fde68a" letter-spacing="1.5">AVAILABLE FOR ROLES &amp; CLIENTS</text>
  </g>

  <!-- Name -->
  <text x="80" y="210" font-family="'Space Grotesk', system-ui, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Opeyemi Olamiju
  </text>

  <!-- Title / Tagline -->
  <text x="80" y="280" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="700" fill="#f59e0b">
    Data &amp; Automation Engineer for HR &amp; Recruitment Teams
  </text>

  <!-- Description paragraph -->
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="22" fill="#d6d3d1">
    I build ML models and Python pipelines that turn messy people data into
  </text>
  <text x="80" y="375" font-family="system-ui, sans-serif" font-size="22" fill="#d6d3d1">
    actionable dashboards and early-warning flight-risk alerts.
  </text>

  <!-- Pills / Core Strengths -->
  <g transform="translate(80, 435)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="230" height="42" rx="6" fill="#292524" stroke="#44403c" stroke-width="1" />
    <text x="18" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#fde68a">Predictive Attrition (ML)</text>

    <!-- Pill 2 -->
    <rect x="245" y="0" width="220" height="42" rx="6" fill="#292524" stroke="#44403c" stroke-width="1" />
    <text x="263" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#fde68a">Python &amp; FastAPI APIs</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="250" height="42" rx="6" fill="#292524" stroke="#44403c" stroke-width="1" />
    <text x="498" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#fde68a">Pipeline Deduplication &amp; BI</text>
  </g>

  <!-- Footer link / branding -->
  <text x="80" y="540" font-family="monospace" font-size="18" font-weight="bold" fill="#a8a29e">
    buildwithope.com · github.com/kikibillz · odunayoopamiju@gmail.com
  </text>
</svg>
